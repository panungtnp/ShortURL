services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shorturl
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@db:5432/shorturl
      BASE_URL: http://localhost:3001
    ports:
      - "3001:3001"
    depends_on:
      - db

volumes:
  pgdata:
